[[language]]
name = "markdown"
text-width = 80
soft-wrap.enable = true
soft-wrap.wrap-at-text-width = true


[[language]]
name = "go"
auto-format = true                         # format on save via gopls (goimports-equivalent)
diagnostic-severity = "hint"               # show everything gopls reports, down to hints
text-width = 100
#rulers = [100]
roots = ["go.mod", "go.work", ".git"]
indent = { tab-width = 4, unit = "\t" }    # gofmt mandates tabs; this just affects the editor's own indent logic
language-servers = ["gopls"]

[[language]]
name = "gomod"
language-servers = ["gopls"]
auto-format = true

[language-server.gopls.config]
"formatting.gofumpt" = true                 # stricter superset of gofmt
# "formatting.local" = "github.com/yourorg" # groups your own module's imports separately
"build.buildFlags" = []                     # e.g. ["-tags=integration"]
"ui.completion.usePlaceholders" = true
"ui.completion.completionBudget" = "100ms"
"ui.diagnostic.staticcheck" = true
"ui.diagnostic.analyses" = { unusedparams = true, unusedwrite = true, unusedvariable = true, nilness = true, shadow = true, useany = true, ST1000 = false }
"ui.semanticTokens" = true
"ui.navigation.importShortcut" = "Both"
"ui.codelenses" = { generate = true, regenerate_cgo = true, tidy = true, upgrade_dependency = true, vendor = true, test = true, run_govulncheck = true, gc_details = false }
"ui.inlayhint.hints" = { assignVariableTypes = true, compositeLiteralFields = true, compositeLiteralTypes = true, constantValues = true, functionTypeParameters = true, parameterNames = false, rangeVariableTypes = true }

# --- Optional: golangci-lint as a second LSP (Language Server Protocol) source, diagnostics only ---
# Install: go install github.com/nametake/golangci-lint-langserver@latest
# Adjust the --out-format flag if your golangci-lint version expects a different one.
[language-server.golangci-lint-langserver]
command = "golangci-lint-langserver"
 
[language-server.golangci-lint-langserver.config]
command = ["golangci-lint", "run", "--out-format", "json", "--issues-exit-code=0"]


# =============================================================================
# Web development: JavaScript / TypeScript / React / HTML / CSS / JSON / GraphQL
# =============================================================================
#
# Tools (all installed globally with npm into the nvm-managed Node):
#   npm install -g typescript@6 typescript-language-server \
#     vscode-langservers-extracted graphql-language-service-cli prettier \
#     @tailwindcss/language-server @olrtg/emmet-language-server
#
# Notes:
#   * typescript-language-server prefers the project's own node_modules/typescript
#     when present; the global TypeScript 6 is only the fallback. TypeScript 7
#     (the native Go port) does not ship tsserver.js, so keep the global one at 6.
#   * ESLint diagnostics come from vscode-eslint-language-server, which loads the
#     project's local eslint and its config (flat config auto-detected). No global
#     eslint is required and projects without an eslint config simply get nothing.
#     IMPORTANT: vscode-langservers-extracted >= 4.9 ships an ESLint server that only
#     supports LSP *pull* diagnostics, which Helix 25.07 does not implement, so it
#     shows nothing. The last push-based release (4.8.0) is installed separately:
#       npm install --prefix ~/.local/lib/vscode-eslint-language-server-4.8 vscode-langservers-extracted@4.8.0
#       ln -s ~/.local/lib/vscode-eslint-language-server-4.8/node_modules/.bin/vscode-eslint-language-server \
#             ~/.local/bin/vscode-eslint-language-server-4.8
#     Once Helix gains pull diagnostics, switch the command back to
#     "vscode-eslint-language-server" and drop the 4.8 install.
#   * Prettier is the formatter for every web language below. `%{buffer_name}`
#     lets prettier pick the parser and honour the project's .prettierrc and
#     .prettierignore. It takes precedence over LSP formatting.
#   * tailwindcss-ls is inert until it finds a Tailwind config in the workspace.
#   * Verify with `hx --health typescript` (or tsx, html, css, json, graphql).

# --- Language servers ---------------------------------------------------------

[language-server.typescript-language-server]
command = "typescript-language-server"
args = ["--stdio"]

[language-server.typescript-language-server.config]
hostInfo = "helix"
# Complete `fn` as `fn(|)` and move into the parens (snippet).
completions = { completeFunctionCalls = true }

[language-server.typescript-language-server.config.preferences]
quotePreference = "auto"                       # match what the file already uses
importModuleSpecifierPreference = "shortest"   # shortest | relative | non-relative | project-relative
importModuleSpecifierEnding = "auto"
includeCompletionsForModuleExports = true      # auto-import suggestions from other modules
includeCompletionsForImportStatements = true
includeCompletionsWithSnippetText = true
includeCompletionsWithInsertText = true
includeAutomaticOptionalChainCompletions = true
includeCompletionsWithClassMemberSnippets = true
includeCompletionsWithObjectLiteralMethodSnippets = true
jsxAttributeCompletionStyle = "auto"           # auto | braces | none
providePrefixAndSuffixTextForRename = true
allowRenameOfImportPath = true
allowTextChangesInNewFiles = true
displayPartsForJSDoc = true
useLabelDetailsInCompletionEntries = true

# Inlay hints. `includeInlayParameterNameHints` accepts "none" | "literals" | "all";
# "literals" only annotates literal arguments (e.g. `f(/* count: */ 3)`) and is
# far less noisy than "all". Toggle inlay hints at runtime with :toggle lsp.display-inlay-hints
[language-server.typescript-language-server.config.typescript.inlayHints]
includeInlayEnumMemberValueHints = true
includeInlayFunctionLikeReturnTypeHints = true
includeInlayFunctionParameterTypeHints = true
includeInlayParameterNameHints = "literals"
includeInlayParameterNameHintsWhenArgumentMatchesName = false
includeInlayPropertyDeclarationTypeHints = true
includeInlayVariableTypeHints = false
includeInlayVariableTypeHintsWhenTypeMatchesName = false

[language-server.typescript-language-server.config.javascript.inlayHints]
includeInlayEnumMemberValueHints = true
includeInlayFunctionLikeReturnTypeHints = true
includeInlayFunctionParameterTypeHints = true
includeInlayParameterNameHints = "literals"
includeInlayParameterNameHintsWhenArgumentMatchesName = false
includeInlayPropertyDeclarationTypeHints = true
includeInlayVariableTypeHints = false
includeInlayVariableTypeHintsWhenTypeMatchesName = false

# ESLint (diagnostics + code actions such as "fix this" / "disable rule").
# Uses the project's local eslint. ESLint 9 flat config (eslint.config.*) is
# auto-detected; legacy .eslintrc.* still works for ESLint 8.
[language-server.vscode-eslint-language-server]
command = "vscode-eslint-language-server-4.8"     # see note at top of this section
args = ["--stdio"]

[language-server.vscode-eslint-language-server.config]
validate = "on"
run = "onType"                                 # onType | onSave
experimental = {}                              # must exist (server reads experimental.useFlatConfig); empty = auto-detect flat vs legacy config
nodePath = ""                                  # "" = resolve eslint from the project
rulesCustomizations = []                       # e.g. [{ rule = "no-unused-vars", severity = "warn" }]
problems = { shortenToSingleLine = false }
format = false                                 # prettier formats; eslint only lints
quiet = false                                  # set true to hide warnings and show only errors
onIgnoredFiles = "off"
codeActionOnSave = { mode = "all" }
workingDirectory = { mode = "auto" }           # "auto" copes with monorepos / nested packages

[language-server.vscode-eslint-language-server.config.codeAction.disableRuleComment]
enable = true
location = "separateLine"

[language-server.vscode-eslint-language-server.config.codeAction.showDocumentation]
enable = true

[language-server.vscode-html-language-server]
command = "vscode-html-language-server"
args = ["--stdio"]

[language-server.vscode-html-language-server.config]
provideFormatter = false                       # prettier formats
html = { autoClosingTags = true, autoCreateQuotes = true }
css = { validate = { enable = true } }         # <style> blocks
javascript = { validate = { enable = true } }  # <script> blocks

[language-server.vscode-css-language-server]
command = "vscode-css-language-server"
args = ["--stdio"]

[language-server.vscode-css-language-server.config]
provideFormatter = false                       # prettier formats
css = { validate = { enable = true }, lint = { unknownAtRules = "ignore" } }   # ignore @tailwind/@apply etc.
scss = { validate = { enable = true }, lint = { unknownAtRules = "ignore" } }
less = { validate = { enable = true }, lint = { unknownAtRules = "ignore" } }

# JSON with schema validation/completion from SchemaStore for common config files.
[language-server.vscode-json-language-server]
command = "vscode-json-language-server"
args = ["--stdio"]

[language-server.vscode-json-language-server.config]
provideFormatter = false                       # prettier formats

[language-server.vscode-json-language-server.config.json]
validate = { enable = true }
format = { enable = false }

[[language-server.vscode-json-language-server.config.json.schemas]]
fileMatch = ["package.json"]
url = "https://json.schemastore.org/package.json"

[[language-server.vscode-json-language-server.config.json.schemas]]
fileMatch = ["tsconfig.json", "tsconfig.*.json", "jsconfig.json"]
url = "https://json.schemastore.org/tsconfig.json"

[[language-server.vscode-json-language-server.config.json.schemas]]
fileMatch = [".prettierrc", ".prettierrc.json"]
url = "https://json.schemastore.org/prettierrc.json"

[[language-server.vscode-json-language-server.config.json.schemas]]
fileMatch = [".eslintrc", ".eslintrc.json"]
url = "https://json.schemastore.org/eslintrc.json"

[[language-server.vscode-json-language-server.config.json.schemas]]
fileMatch = [".babelrc", ".babelrc.json", "babel.config.json"]
url = "https://json.schemastore.org/babelrc.json"

[[language-server.vscode-json-language-server.config.json.schemas]]
fileMatch = ["lerna.json"]
url = "https://json.schemastore.org/lerna.json"

[[language-server.vscode-json-language-server.config.json.schemas]]
fileMatch = ["turbo.json"]
url = "https://turbo.build/schema.json"

[[language-server.vscode-json-language-server.config.json.schemas]]
fileMatch = ["vercel.json"]
url = "https://openapi.vercel.sh/vercel.json"

[[language-server.vscode-json-language-server.config.json.schemas]]
fileMatch = [".vscode/settings.json"]
url = "https://json.schemastore.org/vscode-settings.json"

[[language-server.vscode-json-language-server.config.json.schemas]]
fileMatch = ["manifest.json", "*.webmanifest"]
url = "https://json.schemastore.org/web-manifest.json"

# GraphQL: needs a graphql.config.* / .graphqlrc* in the project to know the schema.
[language-server.graphql-language-service]
command = "graphql-lsp"
args = ["server", "-m", "stream"]

# Tailwind CSS class completion/hover/lint. Only activates when a Tailwind config exists.
[language-server.tailwindcss-ls]
command = "tailwindcss-language-server"
args = ["--stdio"]

[language-server.tailwindcss-ls.config]
# Let the server understand JSX/TSX class attributes and helper calls like clsx()/cva().
tailwindCSS = { experimental = { classRegex = [["(?:clsx|cn|cva|classnames|twMerge)\\(([^)]*)\\)", "[\"'`]([^\"'`]*)[\"'`]"]] } }

# Emmet abbreviations (div>ul>li*3, .card, etc.) expanded via completion.
[language-server.emmet-ls]
command = "emmet-language-server"
args = ["--stdio"]

# --- Formatter ----------------------------------------------------------------
# Prettier reads the project's .prettierrc / prettier.config.* and .prettierignore
# relative to the file. `--stdin-filepath` also selects the right parser.
# To override for a single project, drop a .helix/languages.toml in that project.

# --- Languages ----------------------------------------------------------------

[[language]]
name = "javascript"
auto-format = true
language-servers = ["typescript-language-server", "vscode-eslint-language-server", "tailwindcss-ls", "emmet-ls"]
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }
roots = ["package.json", "jsconfig.json", "tsconfig.json"]

[[language]]
name = "jsx"
auto-format = true
language-servers = ["typescript-language-server", "vscode-eslint-language-server", "tailwindcss-ls", "emmet-ls"]
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }
roots = ["package.json", "jsconfig.json", "tsconfig.json"]

[[language]]
name = "typescript"
auto-format = true
language-servers = ["typescript-language-server", "vscode-eslint-language-server", "tailwindcss-ls", "emmet-ls"]
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }
roots = ["package.json", "tsconfig.json"]

[[language]]
name = "tsx"
auto-format = true
language-servers = ["typescript-language-server", "vscode-eslint-language-server", "tailwindcss-ls", "emmet-ls"]
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }
roots = ["package.json", "tsconfig.json"]

[[language]]
name = "html"
auto-format = true
language-servers = ["vscode-html-language-server", "tailwindcss-ls", "emmet-ls"]
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }

[[language]]
name = "css"
auto-format = true
language-servers = ["vscode-css-language-server", "tailwindcss-ls", "emmet-ls"]
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }

[[language]]
name = "scss"
auto-format = true
language-servers = ["vscode-css-language-server", "tailwindcss-ls", "emmet-ls"]
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }

[[language]]
name = "json"
auto-format = true
language-servers = ["vscode-json-language-server"]
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }

[[language]]
name = "jsonc"
auto-format = true
language-servers = ["vscode-json-language-server"]
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }

[[language]]
name = "graphql"
auto-format = true
language-servers = ["graphql-language-service"]
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }
roots = ["graphql.config.ts", "graphql.config.js", "graphql.config.json", "graphql.config.yml", "graphql.config.yaml", ".graphqlrc", ".graphqlrc.yml", ".graphqlrc.yaml", ".graphqlrc.json", ".graphqlrc.js", ".graphqlrc.ts", "package.json"]


# =============================================================================
# Clojure
# =============================================================================
#
# Tools:
#   * clojure, clj, lein and clojure-lsp via MacPorts (`sudo port install clojure-lsp`). Java via sdkman.
#     Note: the MacPorts clojure-lsp port lags upstream (2023.02.27 as of 2026-09); if a newer
#     release is ever needed, the native macos-amd64 zip from
#     https://github.com/clojure-lsp/clojure-lsp/releases can be dropped into a PATH dir.
#   * Diagnostics come from clj-kondo, which clojure-lsp bundles (no separate install).
#   * Formatting is done by clojure-lsp with cljfmt; it honours a project's .cljfmt.edn or
#     the :cljfmt key in .lsp/config.edn, so no external formatter is configured.
#   * Per-project server settings live in <project>/.lsp/config.edn; user-wide defaults in
#     ~/.config/clojure-lsp/config.edn. Settings reference: https://clojure-lsp.io/settings/
#   * Extra textobjects (]f, maf, mac) come from runtime/queries/clojure/textobjects.scm
#     in this config dir.
#   * REPL: Helix has no REPL integration; run `clj` or `lein repl` in a split terminal.

[[language]]
name = "clojure"
auto-format = true                         # format on save via clojure-lsp (cljfmt)
language-servers = ["clojure-lsp"]
roots = ["project.clj", "build.boot", "deps.edn", "shadow-cljs.edn", "bb.edn", ".git"]

[language-server.clojure-lsp]
command = "clojure-lsp"

[language-server.clojure-lsp.config]
# Sent as initializationOptions. Keys are clojure-lsp settings with the leading colon dropped.
"semantic-tokens?" = true
"hover" = { "hide-file-location?" = true, "arity-on-same-line?" = true }
"completion" = { "analysis-type" = "fast-but-stale" }
"lint-project-files-after-startup?" = true
# Example: change which forms cljfmt treats specially
# "cljfmt" = { "indents" = { "my-macro" = [["inner", 0]] } }


# =============================================================================
# C / C++ / CMake
# =============================================================================
#
# Toolchain: the Apple Command Line Tools (/Library/Developer/CommandLineTools) provide
# clang, clangd, clang-format and lldb-dap, all at the same LLVM version, so they are used
# directly. clangd is on PATH as /usr/bin/clangd; clang-format and lldb-dap are not, so they
# are reached through `xcrun`, which resolves the active Xcode/CLT toolchain.
#
# MacPorts alternative (clang-21 and llvm-21 are installed): the same tools exist as
# clangd-mp-21, clang-format-mp-21, clang-tidy-mp-21. Swap the commands below to use them,
# or run `sudo port select --set clang mp-clang-21` to get unversioned names (note that this
# also makes `clang`/`clang++` on PATH point at MacPorts instead of Apple's compiler).
# There is no current lldb port (lldb-7.0 is the newest), so lldb-dap stays with the CLT.
#
# Projects: clangd wants a compile_commands.json at the project root. With CMake:
#   cmake -S . -B build -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_BUILD_TYPE=Debug
#   ln -sf build/compile_commands.json .
# Without one (single-file exercises) clangd falls back to `fallbackFlags` below.
# Formatting: clang-format reads the nearest .clang-format walking up from the file; put one
# in ~/.clang-format for a personal default (e.g. `BasedOnStyle: Google` + `IndentWidth: 4`).
#
# CMake language server: install with `sudo port install neocmakelsp` (Helix's default for
# the cmake language is [neocmakelsp, cmake-language-server]; either works once on PATH).

[language-server.clangd]
command = "clangd"
args = [
  "--background-index",            # index the whole project for go-to-definition/references
  "--clang-tidy",                  # run clang-tidy checks (configured via .clang-tidy files)
  "--completion-style=detailed",
  "--header-insertion=iwyu",       # add #include for completed symbols, include-what-you-use style
  "--header-insertion-decorators=0",
  "--function-arg-placeholders=1", # complete f(|a, b|) with placeholders for the arguments
  "--all-scopes-completion",
  "--pch-storage=memory",
  "--log=error",
]

[language-server.clangd.config]
# Used only when no compile_commands.json / compile_flags.txt covers the file.
fallbackFlags = ["-std=c++23", "-Wall", "-Wextra", "-Wpedantic"]

[[language]]
name = "cpp"
auto-format = true
language-servers = ["clangd"]
formatter = { command = "xcrun", args = ["clang-format", "--assume-filename", "%{buffer_name}"] }
indent = { tab-width = 4, unit = "    " }

[language.debugger]
name = "lldb-dap"
transport = "stdio"
command = "xcrun"
args = ["lldb-dap"]

[[language.debugger.templates]]
name = "binary"
request = "launch"
completion = [ { name = "binary", completion = "filename" } ]
args = { console = "internalConsole", program = "{0}", stopOnEntry = false }

[[language.debugger.templates]]
name = "binary with args"
request = "launch"
completion = [ { name = "binary", completion = "filename" }, { name = "args" } ]
args = { console = "internalConsole", program = "{0}", args = ["{1}"] }

[[language.debugger.templates]]
name = "attach"
request = "attach"
completion = [ "pid" ]
args = { console = "internalConsole", pid = "{0}" }

[[language]]
name = "c"
auto-format = true
language-servers = ["clangd"]
formatter = { command = "xcrun", args = ["clang-format", "--assume-filename", "%{buffer_name}"] }
indent = { tab-width = 4, unit = "    " }

[language.debugger]
name = "lldb-dap"
transport = "stdio"
command = "xcrun"
args = ["lldb-dap"]

[[language.debugger.templates]]
name = "binary"
request = "launch"
completion = [ { name = "binary", completion = "filename" } ]
args = { console = "internalConsole", program = "{0}", stopOnEntry = false }

[[language.debugger.templates]]
name = "attach"
request = "attach"
completion = [ "pid" ]
args = { console = "internalConsole", pid = "{0}" }

[[language]]
name = "cmake"
auto-format = true
language-servers = ["neocmakelsp"]
